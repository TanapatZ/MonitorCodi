    #   UP_PROMETHEUS_HTTP_LISTEN: 0.0.0.0:9130
    # networks: [monitoring]

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  # grafana_data:
  # alertmanager_data:
