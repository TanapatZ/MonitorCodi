    # restart: unless-stopped
    # profiles: [unifi]
    # environment:
    #   UP_UNIFI_DEFAULT_URL: ${UNIFI_URL:-https://unifi.local:8443}
    #   UP_UNIFI_DEFAULT_USER: ${UNIFI_USER:-unpoller}
    #   UP_UNIFI_DEFAULT_PASS: ${UNIFI_PASS:-changeme}
