apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    basicAuth: true
    basicAuthUser: $PROMETHEUS_BASIC_USER
    secureJsonData:
      basicAuthPassword: $PROMETHEUS_BASIC_PASSWORD
    jsonData:
      timeInterval: 30s
