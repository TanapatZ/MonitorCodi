# NDI TCP checks (host:port).
#  - NDI sources listen on a TCP port that usually starts at 5960 (check in the NDI Tools
#    "Access Manager"/your camera's NDI settings; the port may differ per device).
#  - NDI Discovery Server listens on 5959.
- targets: ["192.168.30.21:5960"]
  labels: {name: cam-stage-left-ndi, site: HQ, role: ndi-source}
- targets: ["192.168.30.22:5960"]
  labels: {name: cam-stage-right-ndi, site: HQ, role: ndi-source}
- targets: ["192.168.30.23:5960"]
  labels: {name: cam-back-ndi, site: HQ, role: ndi-source}
- targets: ["192.168.30.5:5959"]
  labels: {name: ndi-discovery-server, site: HQ, role: ndi-discovery}
