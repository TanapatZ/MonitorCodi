groups:
  - name: availability
    rules:
      - alert: DeviceDown
        expr: probe_success{job="icmp"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.role }} {{ $labels.name }} ({{ $labels.instance }}) is unreachable"
          description: "Site {{ $labels.site }}: no ICMP reply for 2 minutes."

      - alert: HighLatency
        expr: avg_over_time(probe_icmp_duration_seconds{job="icmp",phase="rtt"}[5m]) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "High latency to {{ $labels.name }} ({{ $labels.instance }})"
          description: "Average RTT above 50 ms for 5 minutes. Bad for NDI / PTZ control."

      - alert: PacketLoss
        expr: avg_over_time(probe_success{job="icmp"}[10m]) < 0.9
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Packet loss to {{ $labels.name }} ({{ $labels.instance }})"
          description: "More than 10% of pings failed in the last 10 minutes."

      - alert: CameraWebUIDown
        expr: probe_success{job="http_cameras"} == 0
        for: 3m
        labels: {severity: warning}
        annotations:
          summary: "Camera web UI down: {{ $labels.name }}"

      - alert: NdiSourceUnreachable
        expr: probe_success{job="ndi_tcp"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "NDI endpoint unreachable: {{ $labels.name }} ({{ $labels.instance }})"
          description: "TCP connect failed. Camera NDI output or Discovery Server may be down."

  - name: snmp-network
    rules:
      - alert: SnmpScrapeFailed
        expr: up{job=~"snmp_switches|snmp_aps"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "SNMP polling failed for {{ $labels.name }} ({{ $labels.instance }})"
          description: "Check SNMP community/credentials, ACLs, or device health."

      - alert: DeviceRebooted
        expr: sysUpTime{job=~"snmp_switches|snmp_aps"} < 30000
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.name }} rebooted in the last 5 minutes"

      # Name important ports on the switch with a description starting with
      # uplink / ndi / ap / cam / trunk so these alerts work (unused ports stay quiet).
      - alert: ImportantPortDown
        expr: ifOperStatus{job="snmp_switches", ifAlias=~"(?i)^(uplink|ndi|ap|cam|trunk).*"} == 2
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.name }} port {{ $labels.ifName }} ({{ $labels.ifAlias }}) is DOWN"

      - alert: PortFlapping
        expr: changes(ifOperStatus{job="snmp_switches", ifAlias=~"(?i)^(uplink|ndi|ap|cam|trunk).*"}[15m]) > 4
        labels: {severity: warning}
        annotations:
          summary: "Port flapping: {{ $labels.name }} {{ $labels.ifName }} ({{ $labels.ifAlias }})"
          description: "Bad cable/PoE/SFP? State changed more than 4 times in 15 minutes."

      - alert: PortUtilizationHigh
        expr: |
          (
            (rate(ifHCInOctets{job="snmp_switches"}[5m]) * 8 / (ifHighSpeed * 1e6) > 0.8)
            or
            (rate(ifHCOutOctets{job="snmp_switches"}[5m]) * 8 / (ifHighSpeed * 1e6) > 0.8)
          ) and ifHighSpeed > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.name }} {{ $labels.ifName }} ({{ $labels.ifAlias }}) over 80% utilised"

      - alert: NdiPortNearSaturation
        expr: |
          (
            (rate(ifHCInOctets{job="snmp_switches", ifAlias=~"(?i).*ndi.*"}[2m]) * 8 / (ifHighSpeed * 1e6) > 0.7)
            or
            (rate(ifHCOutOctets{job="snmp_switches", ifAlias=~"(?i).*ndi.*"}[2m]) * 8 / (ifHighSpeed * 1e6) > 0.7)
          ) and ifHighSpeed > 0
        for: 3m
        labels: {severity: warning}
        annotations:
          summary: "NDI port {{ $labels.name }} {{ $labels.ifName }} above 70% - risk of dropped frames"
          description: "Full-bandwidth NDI 1080p60 is ~125 Mbps per stream; 1G links saturate quickly."

      - alert: PortErrors
        expr: |
          (rate(ifInErrors{job="snmp_switches"}[10m]) + rate(ifOutErrors{job="snmp_switches"}[10m])) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Errors on {{ $labels.name }} {{ $labels.ifName }} ({{ $labels.ifAlias }})"
          description: "Check cable, duplex mismatch or SFP."

      - alert: PortDiscards
        expr: |
          (rate(ifInDiscards{job="snmp_switches"}[10m]) + rate(ifOutDiscards{job="snmp_switches"}[10m])) > 10
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Discards on {{ $labels.name }} {{ $labels.ifName }} ({{ $labels.ifAlias }})"
          description: "Likely congestion / queue drops - common when NDI shares a link with other traffic."

  - name: monitoring-host
    rules:
      - alert: MonitoringTargetDown
        expr: up{job=~"prometheus|alertmanager|grafana|node|cadvisor|snmp_exporter|blackbox_exporter"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Monitoring component {{ $labels.job }} is down"

      - alert: HostDiskAlmostFull
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} /
           node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Disk under 15% free on monitoring host ({{ $labels.mountpoint }})"

      - alert: HostHighCpu
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Monitoring host CPU above 90%"
