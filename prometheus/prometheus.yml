global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    org: my-organization

# rule_files:
#   - /etc/prometheus/alert.rules.yml

# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  # ------------------------------------------------ the stack itself
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
  - job_name: snmp_exporter
    static_configs: [{targets: ["snmp-exporter:9116"]}]


  # ------------------------------------------------ SNMP: switches
  - job_name: snmp_switches
    scrape_interval: 30s
    scrape_timeout: 25s
    metrics_path: /snmp
    params:
      auth: [switch_v2]
      module: [if_mib]
    file_sd_configs:
      - files: [/etc/prometheus/targets/switches.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # ------------------------------------------------ SNMP: access points
  # For UniFi APs you can use module: [ubiquiti_unifi] (client counts, radio stats)
  - job_name: snmp_aps
    scrape_interval: 30s
    scrape_timeout: 25s
    metrics_path: /snmp
    params:
      auth: [switch_v2]
      module: [if_mib]
    file_sd_configs:
      - files: [/etc/prometheus/targets/aps.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
