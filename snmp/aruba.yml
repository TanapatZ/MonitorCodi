modules:
  aruba_controller:
    walk:
    - 1.3.6.1.4.1.14823.2.2.1.5.2.1.4
    - 1.3.6.1.4.1.14823.2.2.1.5.2.1.5
    - 1.3.6.1.4.1.14823.2.2.1.5.3.1.1
    metrics:
    - name: wlanAPStatus
      oid: 1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.19
      type: gauge
      help: 'Controller AP status: 1 up, 2 down.'
      indexes:
      - &id001
        labelname: wlanAPMacAddress
        type: PhysAddress48
        fixed_size: 6
      lookups: &id002
      - labels:
        - wlanAPMacAddress
        labelname: wlanAPName
        oid: 1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.3
        type: DisplayString
      - labels:
        - wlanAPMacAddress
        labelname: wlanAPGroupName
        oid: 1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.4
        type: DisplayString
    - name: wlanAPUpTime
      oid: 1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.12
      type: gauge
      help: Hundredths of seconds since controller bootstrap.
      indexes:
      - *id001
      lookups: *id002
    - name: wlanAPRadioNumAssociatedClients
      oid: 1.3.6.1.4.1.14823.2.2.1.5.2.1.5.1.7
      type: gauge
      help: Clients associated to this AP radio.
      indexes:
      - *id001
      - &id003
        labelname: wlanAPRadioNumber
        type: gauge
      lookups: *id002
    - name: wlanAPRadioUtilization
      oid: 1.3.6.1.4.1.14823.2.2.1.5.2.1.5.1.6
      type: gauge
      help: Radio utilization in percent.
      indexes:
      - *id001
      - *id003
      lookups: *id002
    - name: wlanAPRadioChannel
      oid: 1.3.6.1.4.1.14823.2.2.1.5.2.1.5.1.3
      type: gauge
      help: Current radio channel.
      indexes:
      - *id001
      - *id003
      lookups: *id002
    - name: wlanAPRxDataBytes64
      oid: 1.3.6.1.4.1.14823.2.2.1.5.3.1.1.1.23
      type: counter
      help: Data bytes received on this BSSID.
      indexes:
      - *id001
      - *id003
      - &id004
        labelname: wlanAPBSSID
        type: PhysAddress48
        fixed_size: 6
      lookups: *id002
    - name: wlanAPTxDataBytes64
      oid: 1.3.6.1.4.1.14823.2.2.1.5.3.1.1.1.25
      type: counter
      help: Data bytes transmitted on this BSSID.
      indexes:
      - *id001
      - *id003
      - *id004
      lookups: *id002
    - name: wlanAPFrameBandwidthRate
      oid: 1.3.6.1.4.1.14823.2.2.1.5.3.1.1.1.14
      type: gauge
      help: Bandwidth of this BSSID in Kbps.
      indexes:
      - *id001
      - *id003
      - *id004
      lookups: *id002
    - name: wlanAPNumClients
      oid: 1.3.6.1.4.1.14823.2.2.1.5.3.1.1.1.2
      type: gauge
      help: Clients associated to this BSSID.
      indexes:
      - *id001
      - *id003
      - *id004
      lookups: *id002
    - name: wlanAPFrameRetryRate
      oid: 1.3.6.1.4.1.14823.2.2.1.5.3.1.1.1.10
      type: gauge
      help: Retry packets percentage per BSSID.
      indexes:
      - labelname: wlanAPMacAddress
        type: PhysAddress48
        fixed_size: 6
      - labelname: wlanAPRadioNumber
        type: gauge
      - labelname: wlanAPBSSID
        type: PhysAddress48
        fixed_size: 6
      lookups:
      - labels:
        - wlanAPMacAddress
        labelname: wlanAPName
        oid: 1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.3
        type: DisplayString
      - labels:
        - wlanAPMacAddress
        labelname: wlanAPGroupName
        oid: 1.3.6.1.4.1.14823.2.2.1.5.2.1.4.1.4
        type: DisplayString
  event_lldp:
    walk:
    - 1.0.8802.1.1.2.1.4.1.1
    - 1.0.8802.1.1.2.1.3.7.1
    metrics:
    - name: lldpRemSysName
      oid: 1.0.8802.1.1.2.1.4.1.1.9
      type: DisplayString
      help: lldpRemSysName
      indexes: &id005
      - labelname: lldpRemTimeMark
        type: gauge
      - labelname: lldpRemLocalPortNum
        type: gauge
      - labelname: lldpRemIndex
        type: gauge
      lookups: &id006
      - labels:
        - lldpRemLocalPortNum
        labelname: lldpLocPortId
        oid: 1.0.8802.1.1.2.1.3.7.1.3
        type: DisplayString
    - name: lldpRemChassisId
      oid: 1.0.8802.1.1.2.1.4.1.1.5
      type: OctetString
      help: lldpRemChassisId
      indexes: *id005
      lookups: *id006
    - name: lldpRemPortId
      oid: 1.0.8802.1.1.2.1.4.1.1.7
      type: DisplayString
      help: lldpRemPortId
      indexes: *id005
      lookups: *id006
  event_poe:
    walk:
    - 1.3.6.1.2.1.105.1.1.1
    metrics:
    - name: pethPsePortAdminEnable
      oid: 1.3.6.1.2.1.105.1.1.1.3
      type: gauge
      help: pethPsePortAdminEnable
      indexes: &id007
      - labelname: pethPsePortGroupIndex
        type: gauge
      - labelname: pethPsePortIndex
        type: gauge
    - name: pethPsePortDetectionStatus
      oid: 1.3.6.1.2.1.105.1.1.1.6
      type: gauge
      help: pethPsePortDetectionStatus
      indexes: *id007
    - name: pethPsePortPowerPriority
      oid: 1.3.6.1.2.1.105.1.1.1.7
      type: gauge
      help: pethPsePortPowerPriority
      indexes: *id007
  event_clients:
    walk:
    - 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.3
    - 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.10
    - 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.11
    - 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.42
    - 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.43
    - 1.3.6.1.4.1.14823.2.2.1.5.2.2.1.1.12
    - 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.23
    - 1.3.6.1.4.1.14823.2.2.1.5.2.2.1.1.14
    metrics:
    - name: clientRxBytes
      oid: 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.42
      type: counter
      help: Client data octets reported by controller.
      indexes: &id008
      - labelname: clientMac
        type: PhysAddress48
        fixed_size: 6
      - labelname: clientIp
        type: InetAddressIPv4
      lookups: &id009
      - labels:
        - clientMac
        - clientIp
        labelname: clientName
        oid: 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.3
        type: DisplayString
      - labels:
        - clientMac
        - clientIp
        labelname: apLocation
        oid: 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.10
        type: DisplayString
      - labels:
        - clientMac
        - clientIp
        labelname: apBSSID
        oid: 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.11
        type: PhysAddress48
      - labels:
        - clientMac
        labelname: ssid
        oid: 1.3.6.1.4.1.14823.2.2.1.5.2.2.1.1.12
        type: DisplayString
      - labels:
        - clientMac
        labelname: ssid
        oid: 1.3.6.1.4.1.14823.2.2.1.5.2.2.1.1.12
        type: DisplayString
    - name: clientTxBytes
      oid: 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.43
      type: counter
      help: Client data octets reported by controller.
      indexes: *id008
      lookups: *id009
    - name: clientSessionInfo
      oid: 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.23
      type: gauge
      help: Session metadata; signalSNR lookup is station signal to noise ratio.
      indexes:
      - labelname: clientMac
        type: PhysAddress48
        fixed_size: 6
      - labelname: clientIp
        type: InetAddressIPv4
      lookups:
      - labels:
        - clientMac
        - clientIp
        labelname: clientName
        oid: 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.3
        type: DisplayString
      - labels:
        - clientMac
        - clientIp
        labelname: apLocation
        oid: 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.10
        type: DisplayString
      - labels:
        - clientMac
        - clientIp
        labelname: apBSSID
        oid: 1.3.6.1.4.1.14823.2.2.1.4.1.2.1.11
        type: PhysAddress48
      - labels:
        - clientMac
        labelname: ssid
        oid: 1.3.6.1.4.1.14823.2.2.1.5.2.2.1.1.12
        type: DisplayString
      - labels:
        - clientMac
        labelname: ssid
        oid: 1.3.6.1.4.1.14823.2.2.1.5.2.2.1.1.12
        type: DisplayString
      - labels:
        - clientMac
        labelname: signalSNR
        oid: 1.3.6.1.4.1.14823.2.2.1.5.2.2.1.1.14
        type: gauge
